<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Six-Day PPL</title>
<meta name="description" content="A 6-day push/pull/legs hypertrophy split with photographed execution steps, coaching cues and a rest timer.">
<meta name="theme-color" content="#E6EAEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1014" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Six-Day PPL">

<meta property="og:title" content="Six-Day PPL">
<meta property="og:description" content="Push/pull/legs ×2 — every lift photographed, with execution steps, cues and a rest timer.">
<meta property="og:type" content="website">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="mast-row">
      <div class="brand">
        <span class="mark">Six-Day PPL</span>
        <span class="sub">Push · Pull · Legs ×2</span>
      </div>
      <div class="mast-actions">
        <button type="button" class="icon-btn" id="themeBtn" title="Theme: system" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.4v2M12 19.6v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.4 12h2M19.6 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="views" role="tablist" aria-label="Sections">
      <button type="button" class="view-tab" role="tab" data-view="train" aria-selected="true">Train</button>
      <button type="button" class="view-tab" role="tab" data-view="core" aria-selected="false">Core &amp; cardio</button>
      <button type="button" class="view-tab" role="tab" data-view="guide" aria-selected="false">Guide</button>
    </div>

    <div class="rail-scroll" id="railScroll">
      <div class="rail" id="rail" role="tablist" aria-label="Training day"></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="wrap">
  <footer class="foot">
    <div class="legend">
      <span><i style="background:var(--push)"></i>Push</span>
      <span><i style="background:var(--pull)"></i>Pull</span>
      <span><i style="background:var(--legs)"></i>Legs</span>
      <span><i style="background:var(--done)"></i>Logged</span>
    </div>
    Ticks and movement choices are saved in this browser only. Exercise photographs from the
    open-source free-exercise-db. This is a training plan, not medical advice — if something hurts
    in a joint rather than a muscle, stop the set.
  </footer>
</div>

<div class="timer" id="timer" role="group" aria-label="Rest timer">
  <div class="timer-face">
    <span class="clock" id="clock">0:00</span>
  </div>
  <div class="timer-presets">
    <button type="button" data-preset="60" aria-pressed="false" title="60 second rest">60</button>
    <button type="button" data-preset="90" aria-pressed="false" title="90 second rest">90</button>
    <button type="button" data-preset="120" aria-pressed="false" title="2 minute rest">2m</button>
    <button type="button" data-preset="180" aria-pressed="false" title="3 minute rest">3m</button>
  </div>
  <button type="button" class="timer-stop" id="timerStop" hidden>Stop</button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
